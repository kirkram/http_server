<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Webserv</title>
    <style>
        /* Prevent FOUC - hide body until CSS loads */
        html {
            visibility: hidden;
            opacity: 0;
        }
        
        body {
            font-family: sans-serif;
            background-color: black;
            color: #62ffcd;
        }

        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("img/background.jpg");
            background-size: cover;
            z-index: 0;
            animation: color-change 2s linear infinite;
        }

        .star {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            animation: animate 8s ease-in-out infinite;
        }

        .star.star1 { animation-delay: 0s; background: url(img/star1.png); }
        .star.star2 { animation-delay: -1s; background: url(img/star2.png); }
        .star.star3 { animation-delay: -2s; background: url(img/star3.png); }
        .star.star4 { animation-delay: -3s; background: url(img/star4.png); }
        .star.star5 { animation-delay: -4s; background: url(img/star5.png); }
        .star.star6 { animation-delay: -5s; background: url(img/star6.png); }
        .star.star7 { animation-delay: -6s; background: url(img/star7.png); }
        .star.star8 { animation-delay: -7s; background: url(img/star8.png); }

        @keyframes animate {
            0%,20%,40%,60%,80%,100% {opacity: 0;}

            10%,30%,50%,70%,90% {opacity: 1;}
        }

        @keyframes color-change {
            0%, 100% { filter: hue-rotate(0deg); }
            0% { filter: hue-rotate(360deg); }
        }

        .index-wrp {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1;
        }

        .main-content {
            max-width: 560px;
            width: 100%;
            font-size: clamp(20px, 18vw, 80px);
            letter-spacing: 10px;
            font-weight: 700;
            stroke: #62ffcd;
            stroke-width: 2px;
            fill: none;
            text-align: center;
        }

        p{
            position: relative;
            font-size: clamp(16px, 4vw, 40px);
            font-weight: 500;
            margin-top: 0;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 300px;
            margin: 0 auto;
            margin-bottom: 20px;
        }

        .file-list {
            margin-top: 30px;
            max-width: 600px;
            width: 100%;
        }

        .file-item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            background: rgba(98, 255, 205, 0.1);
            border: 2px solid #62ffcd;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: rgba(98, 255, 205, 0.2);
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(98, 255, 205, 0.3);
        }

        .file-name {
            flex: 1;
            margin-right: 15px;
        }

        .file-name a {
            color: #62ffcd;
            text-decoration: none;
            font-size: clamp(14px, 3vw, 18px);
            word-break: break-all;
            transition: color 0.3s ease;
        }

        .file-name a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px #62ffcd;
        }

        .file-action-btn {
            background: transparent;
            border: 1px solid #62ffcd;
            color: #62ffcd;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .file-action-btn:hover {
            background: #62ffcd;
            color: black;
        }

        .delete-btn {
            border-color: #ff6262;
            color: #ff6262;
        }

        .delete-btn:hover {
            background: #ff6262;
            color: white;
        }

        /* Make page visible after CSS loads */
        html {
            visibility: visible;
            opacity: 1;
        }

    </style>
</head>
<body>   
        <div class="background-animation"></div>
        <div class="star star1"></div>
        <div class="star star2"></div>
        <div class="star star3"></div>
        <div class="star star4"></div>
        <div class="star star5"></div>
        <div class="star star6"></div>
        <div class="star star7"></div>
        <div class="star star8"></div>
        <div class="index-wrp">
            <div class="main-content">
                <svg width="100%" height="100%" viewBox="0 0 450 220" preserveAspectRatio="xMidYMid meet">
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">Webserv</text>
            </div>
            <p>Welcome to our server</p>
            <div class="form">
                <form action="/cgi/print_form.cgi" method="POST" enctype="application/x-www-form-urlencoded">
                    <input type="text" id="fname" name="fname" placeholder="Enter name"><br>
                    <input type="submit" value="Upload name" />
                </form>  
            </div>
            <div class="form">
                <form action="/" method="POST" enctype="multipart/form-data">
                    <input type="file" id="file" name="file" accept="*/*" onchange="enableSubmitBtn()">
                    <input type="submit" id="submitBtn" value="Upload file" disabled>
                </form>  
            </div>
            <div class="file-list">
                <div class="file-item-list" id="fileList">
                    <!-- Files will be loaded dynamically -->
                </div>           
            </div>
</body>
</html>

<script>
    function loadFileList() {
        fetch('/api/files')
            .then(response => response.json())
            .then(data => {
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = '';
                
                if (data.error) {
                    fileList.innerHTML = `<div class="file-item">Error: ${data.error}</div>`;
                    return;
                }
                
                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        
                        const fileName = document.createElement('span');
                        fileName.className = 'file-name';
                        const link = document.createElement('a');
                        link.href = file.path;
                        link.textContent = file.path;
                        fileName.appendChild(link);
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'file-action-btn delete-btn';
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.onclick = () => deleteFile(file.name);
                        
                        fileItem.appendChild(fileName);
                        fileItem.appendChild(deleteBtn);
                        fileList.appendChild(fileItem);
                    });
                }
            })
            .catch(error => {
                console.error('Error loading file list:', error);
            });
    }

    function enableSubmitBtn() {
        const fileInput = document.getElementById("file");
        const submitButton = document.getElementById("submitBtn");
        submitButton.disabled = !fileInput.files.length;
    }

    function deleteFile(filename) {
        fetch(`/${filename}`, {
            method: 'DELETE',
        })
        .then(response => {
            if (response.ok) {
                loadFileList();
            } else {
                console.error("Failed to delete the file on the server");
            }
        })
        .catch(error => {
            console.error("Error deleting file:", error);
        });
    }

    // Handle form submission
    document.addEventListener('DOMContentLoaded', function() {
        loadFileList();
        
        const uploadForm = document.querySelector('form[enctype="multipart/form-data"]');
        if (uploadForm) {
            uploadForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                
                fetch('/', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.redirected || response.status === 303) {
                        loadFileList();
                        this.reset();
                        document.getElementById('submitBtn').disabled = true;
                    }
                })
                .catch(error => {
                    console.error('Error uploading file:', error);
                });
            });
        }
    });
</script>
